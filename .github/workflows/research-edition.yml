name: Research Edition CI

on:
  workflow_dispatch:
  push:
    branches: [research-edition]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,all]"
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check agent_reach tests
      - name: Mypy
        run: python -m mypy agent_reach

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: agent-reach version
      - run: agent-reach-research --help
      - run: agent-reach-exa --help
